<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Inventory</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="topnav">
  <a class="brand here" href="./">Lab Inventory</a>
  <a href="chemicals/">Building blocks</a>
  <a href="cells/">Cell lines</a>
</nav>

<header>
  <div class="titles">
    <h1>Lab Inventory</h1>
    <p>What is on the shelves and in the freezer. Rebuilt from the lab's Google Sheets every night, so edit the sheet and this follows.</p>
  </div>
  <div class="tally" id="built"></div>
</header>

<main>
  <p class="status" id="status">Loading…</p>
  <div class="sections" id="sections"></div>
</main>

<script>
'use strict';

function line(tag, className, text) {
  const node = document.createElement(tag);
  node.className = className;
  node.textContent = text;
  return node;
}

fetch('summary.json')
  .then((r) => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then((data) => {
    document.getElementById('built').textContent = 'rebuilt ' + data.built;
    const wrap = document.getElementById('sections');
    for (const s of data.sections) {
      const card = document.createElement('a');
      card.className = 'section-card';
      card.href = s.slug + '/';
      card.appendChild(line('h2', '', s.title));
      const count = line('div', 'count', '');
      count.appendChild(line('strong', '', s.count));
      count.appendChild(document.createTextNode(s.unit));
      card.appendChild(count);
      card.appendChild(line('p', '', s.blurb));
      wrap.appendChild(card);
    }
    document.getElementById('status').hidden = true;
  })
  .catch((err) => {
    const status = document.getElementById('status');
    status.hidden = false;
    status.textContent = 'Could not load the inventory summary: ' + err.message;
  });
</script>
</body>
</html>
