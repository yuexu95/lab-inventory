<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell lines · Lab Inventory</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<nav class="topnav">
  <a class="brand" href="../">Lab Inventory</a>
  <a href="../chemicals/">Building blocks</a>
  <a class="here" href="./">Cell lines</a>
  <a href="freezer-map/">Freezer map</a>
  <a href="../antibody/">Antibody</a>
  <a href="../dna-plasmids/">DNA plasmids</a>
</nav>

<header>
  <div class="titles">
    <h1>Cell lines</h1>
    <p>ATCC lines on hand or on order, grouped by program. Open a card for the base medium and what the line is for.</p>
  </div>
  <div class="tally">showing<strong id="tally">—</strong><span id="total"></span></div>
</header>

<div class="cell-tools">
  <a class="tool-link" href="freezer-map/">Open freezer map</a>
</div>

<div class="toolbar">
  <input id="q" type="search" placeholder="search name, ATCC no., organism, tissue, marker…" autocomplete="off">
  <div class="chips" id="programChips" aria-label="Filter by program"></div>
</div>

<div class="groupbar">
  <span class="groupbar-label">species</span>
  <div class="chips" id="speciesChips" aria-label="Filter by species"></div>
  <span class="groupbar-label">box</span>
  <div class="chips" id="boxChips" aria-label="Filter by box"></div>
</div>

<main>
  <p class="status" id="status">Loading cell lines…</p>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
</div>

<script src="app.js"></script>
</body>
</html>
